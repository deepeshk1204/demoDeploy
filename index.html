<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stranger Things – Final Episode Countdown</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            orbitron: ['Orbitron', 'sans-serif']
          },
          colors: {
            stRed: '#e50914'
          },
          boxShadow: {
            neon: '0 0 25px rgba(229,9,20,0.8)'
          }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen font-orbitron text-white relative overflow-hidden">

  <!-- 🔴 BACKGROUND POSTER -->
  <div
    class="absolute inset-0 bg-cover bg-center"
    style="background-image: url('https://i0.wp.com/thefutureoftheforce.com/wp-content/uploads/2025/10/Stranger-Things-5-Official-Poster-Header-FUTURE-OF-THE-FORCE.jpg');">
  </div>

  <!-- Dark overlay -->
  <div class="absolute inset-0 bg-black/80"></div>

  <!-- Content -->
  <div class="relative z-10 min-h-screen flex items-center justify-center px-6">

    <div class="border border-red-900/40 rounded-2xl px-10 py-12
                bg-black/60 backdrop-blur-md shadow-neon max-w-xl w-full">

      <h1 class="text-stRed text-3xl md:text-4xl tracking-[0.3em] text-center
                 drop-shadow-[0_0_20px_#e50914]">
        STRANGER THINGS
      </h1>

      <p class="text-center mt-3 text-xs tracking-widest opacity-80">
        FINAL EPISODE COUNTDOWN
      </p>

      <!-- TIMER -->
      <div class="mt-10 grid grid-cols-4 gap-4 text-center">
        <div class="bg-black/70 rounded-xl py-5 shadow-inner shadow-red-800/40">
          <div id="days" class="text-3xl text-stRed">00</div>
          <div class="text-[10px] mt-2 tracking-widest opacity-70">DAYS</div>
        </div>
        <div class="bg-black/70 rounded-xl py-5 shadow-inner shadow-red-800/40">
          <div id="hours" class="text-3xl text-stRed">00</div>
          <div class="text-[10px] mt-2 tracking-widest opacity-70">HOURS</div>
        </div>
        <div class="bg-black/70 rounded-xl py-5 shadow-inner shadow-red-800/40">
          <div id="minutes" class="text-3xl text-stRed">00</div>
          <div class="text-[10px] mt-2 tracking-widest opacity-70">MIN</div>
        </div>
        <div class="bg-black/70 rounded-xl py-5 shadow-inner shadow-red-800/40">
          <div id="seconds" class="text-3xl text-stRed animate-pulse">00</div>
          <div class="text-[10px] mt-2 tracking-widest opacity-70">SEC</div>
        </div>
      </div>

      <!-- 🔗 LINKS -->
      <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center">
        <a
          href="https://www.netflix.com"
          target="_blank"
          class="px-6 py-3 border border-stRed text-stRed rounded-lg
                 hover:bg-stRed hover:text-black transition
                 drop-shadow-[0_0_12px_#e50914] text-sm tracking-widest text-center">
          WATCH ON NETFLIX
        </a>

        <a
          href="https://www.youtube.com/watch?v=b9EkMc79ZSU"
          target="_blank"
          class="px-6 py-3 border border-white/30 rounded-lg
                 hover:border-stRed hover:text-stRed transition
                 text-sm tracking-widest text-center">
          WATCH TRAILER
        </a>
      </div>

      <p class="text-center mt-8 text-[10px] tracking-[0.3em] opacity-50">
        THE UPSIDE DOWN IS WAITING
      </p>
    </div>
  </div>

  <!-- TIMER SCRIPT -->
  <script>
    // 🔧 CHANGE DATE HERE
    const targetDate = new Date("2026-01-01T00:00:00").getTime();

    setInterval(() => {
      const now = new Date().getTime();
      const diff = targetDate - now;
      if (diff <= 0) return;

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / (1000 * 60)) % 60);
      const s = Math.floor((diff / 1000) % 60);

      days.textContent = String(d).padStart(2, "0");
      hours.textContent = String(h).padStart(2, "0");
      minutes.textContent = String(m).padStart(2, "0");
      seconds.textContent = String(s).padStart(2, "0");
    }, 1000);
  </script>

</body>
</html>
