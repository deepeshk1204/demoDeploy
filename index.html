<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stranger Things – Final Episode Countdown</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            orbitron: ['Orbitron', 'sans-serif']
          },
          colors: {
            stRed: '#e50914'
          },
          boxShadow: {
            neon: '0 0 30px rgba(229,9,20,0.8)'
          }
        }
      }
    }
  </script>
</head>

<body class="font-orbitron text-white bg-black overflow-x-hidden">

  <!-- Background poster -->
  <div class="fixed inset-0 bg-cover bg-center"
       style="background-image:url('https://images.unsplash.com/photo-1606813902914-3c6c7d6e41d5?q=80&w=2000');">
  </div>
  <div class="fixed inset-0 bg-black/80"></div>

  <!-- MAIN -->
  <main class="relative z-10">

    <!-- HERO -->
    <section class="min-h-screen flex items-center justify-center">
      <div class="bg-black/60 backdrop-blur-md border border-red-900/40 rounded-2xl p-12 shadow-neon text-center max-w-3xl">
        <h1 class="text-stRed text-4xl tracking-[0.35em] drop-shadow-[0_0_25px_#e50914]">
          STRANGER THINGS
        </h1>
        <p class="mt-3 text-xs tracking-widest opacity-80">
          FINAL EPISODE COUNTDOWN
        </p>

        <!-- TIMER -->
        <div class="mt-10 grid grid-cols-4 gap-6">
          <div class="bg-black/70 p-5 rounded-xl">
            <div id="days" class="text-4xl text-stRed">00</div>
            <div class="text-xs mt-2 opacity-60">DAYS</div>
          </div>
          <div class="bg-black/70 p-5 rounded-xl">
            <div id="hours" class="text-4xl text-stRed">00</div>
            <div class="text-xs mt-2 opacity-60">HOURS</div>
          </div>
          <div class="bg-black/70 p-5 rounded-xl">
            <div id="minutes" class="text-4xl text-stRed">00</div>
            <div class="text-xs mt-2 opacity-60">MIN</div>
          </div>
          <div class="bg-black/70 p-5 rounded-xl">
            <div id="seconds" class="text-4xl text-stRed animate-pulse">00</div>
            <div class="text-xs mt-2 opacity-60">SEC</div>
          </div>
        </div>

        <!-- LINKS -->
        <div class="mt-10 flex justify-center gap-6">
          <a href="https://www.netflix.com"
             target="_blank"
             class="px-6 py-3 border border-stRed text-stRed rounded-lg hover:bg-stRed hover:text-black transition">
            WATCH ON NETFLIX
          </a>
          <a href="https://www.youtube.com/watch?v=b9EkMc79ZSU"
             target="_blank"
             class="px-6 py-3 border border-white/30 rounded-lg hover:border-stRed transition">
            WATCH TRAILER
          </a>
        </div>
      </div>
    </section>

    <!-- TWITTER -->
    <section class="py-24">
      <h2 class="text-center text-2xl text-stRed tracking-widest mb-12">ON X (TWITTER)</h2>
      <div class="grid grid-cols-2 gap-10 max-w-6xl mx-auto">
        <blockquote class="twitter-tweet"><a href="https://twitter.com/Netflix/status/1541828571235676160"></a></blockquote>
        <blockquote class="twitter-tweet"><a href="https://twitter.com/Stranger_Things/status/1536730679370039296"></a></blockquote>
      </div>
    </section>

    <!-- INSTAGRAM -->
    <section class="py-24">
      <h2 class="text-center text-2xl text-stRed tracking-widest mb-12">TOP REELS</h2>
      <div class="grid grid-cols-3 gap-8 max-w-6xl mx-auto">
        <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/CeYt1M3L3Wy/" data-instgrm-version="14"></blockquote>
        <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/CeSgY9Qr3jP/" data-instgrm-version="14"></blockquote>
        <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/CeQw8d7Lr9n/" data-instgrm-version="14"></blockquote>
      </div>
    </section>

    <!-- YOUTUBE -->
    <section class="py-24">
      <h2 class="text-center text-2xl text-stRed tracking-widest mb-12">TOP YOUTUBE VIDEOS</h2>
      <div class="grid grid-cols-3 gap-10 max-w-6xl mx-auto">
        <iframe class="aspect-video w-full rounded-xl shadow-neon" src="https://www.youtube.com/embed/b9EkMc79ZSU" allowfullscreen></iframe>
        <iframe class="aspect-video w-full rounded-xl shadow-neon" src="https://www.youtube.com/embed/yQEondeGvKo" allowfullscreen></iframe>
        <iframe class="aspect-video w-full rounded-xl shadow-neon" src="https://www.youtube.com/embed/-RcPZdihrp4" allowfullscreen></iframe>
      </div>
    </section>

    <!-- MERCH -->
    <section class="py-24">
      <h2 class="text-center text-2xl text-stRed tracking-widest mb-12">OFFICIAL MERCH</h2>
      <div class="grid grid-cols-2 gap-10 max-w-5xl mx-auto">
        <a href="https://www.netflix.shop/collections/stranger-things?srsltid=AfmBOoq_B2wk5Ipg3YSBwfGE_nmaZLKCj3kLJoREjRzSpDDDyRbMakGt"
           target="_blank"
           class="bg-black/70 p-8 rounded-2xl border border-white/10 hover:border-stRed transition">
          <h3 class="text-xl mb-2">Netflix Official Store</h3>
          <p class="opacity-60">Exclusive drops & collectibles</p>
        </a>
        <a href="https://strangerthings-store.com/"
           target="_blank"
           class="bg-black/70 p-8 rounded-2xl border border-white/10 hover:border-stRed transition">
          <h3 class="text-xl mb-2">Stranger Things Store</h3>
          <p class="opacity-60">Fan merch & posters</p>
        </a>
      </div>
    </section>

  </main>

  <!-- COUNTDOWN SCRIPT -->
  <script>
    const targetDate = new Date("2026-01-01T00:00:00").getTime();
    setInterval(() => {
      const diff = targetDate - Date.now();
      if (diff <= 0) return;
      days.textContent = String(Math.floor(diff / 86400000)).padStart(2, "0");
      hours.textContent = String(Math.floor(diff / 3600000) % 24).padStart(2, "0");
      minutes.textContent = String(Math.floor(diff / 60000) % 60).padStart(2, "0");
      seconds.textContent = String(Math.floor(diff / 1000) % 60).padStart(2, "0");
    }, 1000);
  </script>

  <!-- EMBED SCRIPTS -->
  <script async src="https://platform.twitter.com/widgets.js"></script>
  <script async src="https://www.instagram.com/embed.js"></script>

</body>
</html>
