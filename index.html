<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Netflix Release Tracker</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { orbitron: ['Orbitron', 'sans-serif'] },
          colors: { netflixRed: '#e50914' },
          boxShadow: { neon: '0 0 35px rgba(229,9,20,0.85)' }
        }
      }
    }
  </script>
</head>

<body class="bg-black text-white font-orbitron overflow-x-hidden">

<!-- HERO -->
<section class="min-h-screen flex items-center justify-center text-center">
  <div>
    <h1 class="text-netflixRed text-5xl tracking-[0.35em] drop-shadow-[0_0_30px_#e50914]">
      NETFLIX
    </h1>
    <p class="mt-4 text-xl tracking-widest opacity-80">
      RELEASE TRACKER
    </p>
    <p class="mt-6 text-sm opacity-60">
      Upcoming movies & series — auto-updated
    </p>
  </div>
</section>

<!-- FEATURED -->
<section id="featured" class="py-24"></section>

<!-- THIS MONTH -->
<section id="thisMonth" class="py-24"></section>

<!-- LATER -->
<section id="later" class="py-24"></section>

<!-- LOGIC -->
<script>
const featuredEl = document.getElementById("featured");
const thisMonthEl = document.getElementById("thisMonth");
const laterEl = document.getElementById("later");

fetch("./releases.json")
  .then(res => res.json())
  .then(data => init(data));

function init(releases) {
  const now = new Date();
  const currentMonth = now.getMonth();
  const currentYear = now.getFullYear();

  const featured = releases.find(r => r.featured);
  const thisMonth = releases.filter(r => {
    const d = new Date(r.date);
    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
  });
  const later = releases.filter(r => !thisMonth.includes(r) && !r.featured);

  renderFeatured(featured);
  renderGrid(thisMonth, thisMonthEl, "COMING THIS MONTH");
  renderGrid(later, laterEl, "COMING LATER");
}

function renderFeatured(item) {
  if (!item) return;

  featuredEl.innerHTML = `
    <div class="max-w-6xl mx-auto grid grid-cols-2 gap-12 items-center">
      <img src="${item.poster}" class="rounded-2xl shadow-neon"/>
      <div>
        <h2 class="text-netflixRed text-3xl tracking-widest mb-4">
          FEATURED
        </h2>
        <h3 class="text-2xl mb-6">${item.title}</h3>
        <div id="countdown" class="flex gap-6 text-center"></div>
      </div>
    </div>
  `;

  startCountdown(item.date);
}

function renderGrid(items, container, title) {
  if (!items.length) return;

  container.innerHTML = `
    <h2 class="text-center text-2xl text-netflixRed tracking-widest mb-12">${title}</h2>
    <div class="grid grid-cols-4 gap-8 max-w-7xl mx-auto">
      ${items.map(item => `
        <div class="bg-black/70 p-4 rounded-xl border border-white/10 hover:border-netflixRed transition">
          <img src="${item.poster}" class="rounded-lg mb-4"/>
          <h4 class="text-sm mb-1">${item.title}</h4>
          <p class="text-xs opacity-60">${formatDate(item.date)}</p>
        </div>
      `).join("")}
    </div>
  `;
}

function startCountdown(dateStr) {
  const target = new Date(dateStr).getTime();
  const el = document.getElementById("countdown");

  setInterval(() => {
    const diff = target - Date.now();
    if (diff <= 0) return;

    const d = Math.floor(diff / 86400000);
    const h = Math.floor(diff / 3600000) % 24;
    const m = Math.floor(diff / 60000) % 60;
    const s = Math.floor(diff / 1000) % 60;

    el.innerHTML = `
      ${timerBox(d,"DAYS")}
      ${timerBox(h,"HRS")}
      ${timerBox(m,"MIN")}
      ${timerBox(s,"SEC")}
    `;
  }, 1000);
}

function timerBox(val, label) {
  return `
    <div class="bg-black/70 px-6 py-4 rounded-xl">
      <div class="text-3xl text-netflixRed">${String(val).padStart(2,"0")}</div>
      <div class="text-xs opacity-60">${label}</div>
    </div>
  `;
}

function formatDate(d) {
  return new Date(d).toLocaleDateString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}
</script>

</body>
</html>
